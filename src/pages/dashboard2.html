
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>AAUA MEMO — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --dark-navy: #0f172b;
      --card-bg: #ffffff;
      --accent-gold: #c9a03d;
      --muted: #5a687c;
      --border-light: #eef2f8;
      --error-red: #dc2626;
      --success-green: #10b981;
      --radius-card: 24px;
      --sidebar-bg: #f8fafc;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--dark-navy);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background strips (same as login) */
    .bg-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(15,23,43,0.88) 0%, rgba(15,23,43,0.72) 50%, rgba(15,23,43,0.86) 100%);
      z-index: 1;
    }

    .strip-wrap {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .strip {
      position: absolute;
      display: flex;
      gap: 60px;
      align-items: center;
      animation: scrollLeft var(--dur, 38s) linear infinite;
      white-space: nowrap;
    }
    .strip:nth-child(1) { top: 4%; --dur: 42s; }
    .strip:nth-child(2) { top: 20%; --dur: 48s; animation-delay: -14s; }
    .strip:nth-child(3) { top: 36%; --dur: 36s; animation-delay: -6s; }
    .strip:nth-child(4) { top: 52%; --dur: 54s; animation-delay: -22s; }
    .strip:nth-child(5) { top: 68%; --dur: 40s; animation-delay: -10s; }
    .strip:nth-child(6) { top: 84%; --dur: 46s; animation-delay: -18s; }

    .strip svg {
      flex-shrink: 0;
      opacity: 0.12;
    }

    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* <i class="fas fa-home" style="margin-right: 8px; color: #0f172b;"></i> Dashboard Dashboard Main Layout */
    .dashboard-container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .dashboard-header {
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(2px);
      padding: 18px 28px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-icon {
      background: var(--dark-navy);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text h1 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--dark-navy);
    }
    .logo-text p {
      font-size: 10px;
      color: var(--muted);
    }
    .user-greeting {
      text-align: right;
    }
    .user-greeting span {
      font-size: 13px;
      font-weight: 500;
      color: var(--dark-navy);
    }
    .user-greeting small {
      font-size: 11px;
      color: var(--muted);
      display: block;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #e2e8f0;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.2s;
    }
    .logout-btn:hover {
      background: #fee2e2;
      border-color: var(--error-red);
    }

    /* Content Card */
    .content-card {
      background: rgba(255,255,255,0.97);
      border-radius: 32px;
      padding: 28px 32px;
      flex: 1;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      min-height: 460px;
      transition: all 0.2s;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--dark-navy);
      margin-bottom: 20px;
      border-left: 4px solid var(--accent-gold);
      padding-left: 18px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .stat-card {
      background: #f1f5f9;
      padding: 20px;
      border-radius: 24px;
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-card h3 { font-size: 32px; font-weight: 700; color: var(--dark-navy); }
    .stat-card p { color: var(--muted); margin-top: 8px; }

    /* User Table */
    .users-table {
      width: 100%;
      border-collapse: collapse;
    }
    .users-table th, .users-table td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border-light);
    }
    .users-table th {
      font-weight: 600;
      color: var(--dark-navy);
    }
    .badge {
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 40px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge.admin { background: var(--dark-navy); color: white; }
    .badge.staff { background: #e2e8f0; }

    /* Create memo form */
    .memo-form input, .memo-form textarea, .memo-form select {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border-light);
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .memo-form textarea { min-height: 140px; resize: vertical; }
    .primary-btn {
      background: var(--dark-navy);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .primary-btn:hover { background: #1e2f4d; }

    /* History list */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .history-item {
      background: #f8fafc;
      padding: 16px;
      border-radius: 20px;
      border-left: 4px solid var(--accent-gold);
    }
    .history-title { font-weight: 700; color: var(--dark-navy); }
    .history-date { font-size: 11px; color: var(--muted); margin-top: 6px; }

    /* Profile */
    .profile-detail {
      background: #f8fafc;
      padding: 20px;
      border-radius: 28px;
      margin-bottom: 20px;
    }
    .profile-row {
      display: flex;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
    }
    .profile-label { width: 120px; font-weight: 600; }
    .profile-value { color: #1e293b; }

    /* Bottom Navigation (Fixed) */
    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 520px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      border-radius: 48px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      z-index: 20;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      padding: 6px 10px;
      border-radius: 60px;
      min-width: 68px;
    }

    .nav-icon {
      transition: all 0.25s ease;
      color: #7c8ba0;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #7c8ba0;
      transition: all 0.2s;
    }

    /* Active / Highlighted category (bigger icon + gold accent) */
    .nav-item.active {
      transform: translateY(-4px);
    }
    .nav-item.active .nav-icon {
      color: var(--accent-gold);
      transform: scale(1.35);
      filter: drop-shadow(0 2px 6px rgba(201,160,61,0.3));
    }
    .nav-item.active .nav-label {
      color: var(--dark-navy);
      font-weight: 600;
      font-size: 11px;
    }

    /* Responsive */
    @media (max-width: 560px) {
      .content-card { padding: 20px; }
      .bottom-nav { padding: 8px 12px; }
      .nav-item { min-width: 55px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="bg-stage">
  <div class="bg-overlay"></div>
  <div class="strip-wrap" id="stripsBg"></div>
</div>

<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="logo-area">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <rect x="5" y="3" width="15" height="21" rx="2.5" stroke="white" stroke-width="1.7"/>
          <path d="M9 8h7M9 12h7M9 16h4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M20 15v8l3-2 3 2V15" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>AAUA MEMO</h1>
        <p>Official Memorandum System</p>
      </div>
    </div>
    <div class="user-greeting">
      <span id="userEmailDisplay">staff@aaua.edu.ng</span>
      <small>Authorized Personnel</small>
      <button id="logoutBtnSide" class="logout-btn">Sign out</button>
    </div>
  </div>

  <!-- Dynamic Content Area -->
  <div class="content-card" id="mainContent">
    <!-- content will be injected via JS -->
    <div style="text-align:center; padding:60px;">Loading dashboard...</div>
  </div>

  <!-- Bottom Navigation (5 categories) -->
  <div class="bottom-nav">
    <div class="nav-item" data-tab="user-management">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <span class="nav-label">Users</span>
    </div>
    <div class="nav-item" data-tab="statistics">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3" />
          <path d="M12 2v8M8 6l4-4 4 4" />
          <path d="M3 17h18" />
        </svg>
      </div>
      <span class="nav-label">Stats</span>
    </div>
    <div class="nav-item" data-tab="create-memo">
      <div class="nav-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M12 5v14M5 12h14" stroke="currentColor"/>
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"/>
        </svg>
      </div>
      <span class="nav-label">Create</span>
    </div>
    <div class="nav-item" data-tab="history">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </div>
      <span class="nav-label">History</span>
    </div>
    <div class="nav-item" data-tab="profile">
      <div class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
          <path d="M12 11v4" />
        </svg>
      </div>
      <span class="nav-label">Profile</span>
    </div>
  </div>
</div>

<script>
  // ------------------------ ICON STRIPS (same as login) ------------------------
  (function buildStrips() {
    const iconsArray = [
      `<svg width="52" height="52" viewBox="0 0 52 52" fill="none"><rect x="8" y="10" width="36" height="24" rx="3" stroke="white" stroke-width="1.8"/><rect x="4" y="36" width="44" height="5" rx="2" stroke="white" stroke-width="1.8"/><path d="M20 36l2 4h8l2-4" stroke="white" stroke-width="1.4"/><line x1="12" y1="16" x2="40" y2="16" stroke="white" stroke-width="1.1" stroke-linecap="round" opacity=".4"/></svg>`,
      `<svg width="52" height="52" viewBox="0 0 52 52" fill="none"><path d="M26 42V14" stroke="white" stroke-width="1.8"/><path d="M26 14c-4-4-16-4-20-1v27c4-3 16-3 20 0z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M26 14c4-4 16-4 20-1v27c-4-3-16-3-20 0z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><line x1="10" y1="19" x2="22" y2="18" stroke="white" stroke-width="1.1" stroke-linecap="round" opacity=".5"/></svg>`,
      `<svg width="52" height="52" viewBox="0 0 52 52" fill="none"><path d="M34 7l10 10-17 18-10 2 2-10 15-20z" stroke="white" stroke-width="1.8"/><path d="M29 12l10 10" stroke="white" stroke-width="1.4"/><path d="M7 45l4-2-2-4" stroke="white" stroke-width="1.5"/></svg>`,
      `<svg width="52" height="52" viewBox="0 0 52 52" fill="none"><path d="M26 13L6 23l20 10 20-10-20-10z" stroke="white" stroke-width="1.8"/><path d="M14 29v9c0 3 5.4 6 12 6s12-3 12-6v-9" stroke="white" stroke-width="1.8"/></svg>`,
      `<svg width="52" height="52" viewBox="0 0 52 52" fill="none"><rect x="12" y="9" width="28" height="36" rx="3" stroke="white" stroke-width="1.8"/><line x1="18" y1="19" x2="34" y2="19" stroke="white" stroke-width="1.4"/><line x1="18" y1="25" x2="34" y2="25" stroke="white" stroke-width="1.4"/></svg>`
    ];
    const container = document.getElementById('stripsBg');
    if (container) {
      for (let r = 0; r < 6; r++) {
        const stripDiv = document.createElement('div');
        stripDiv.className = 'strip';
        let inner = '';
        for (let i = 0; i < 14; i++) inner += iconsArray[i % iconsArray.length];
        stripDiv.innerHTML = inner + inner;
        container.appendChild(stripDiv);
      }
    }
  })();

  // ---------- Mock Data & State ----------
  let currentUser = { email: "staff@aaua.edu.ng", name: "James Ogunleye", role: "Staff", department: "Academic Affairs" };
  let memoHistory = [
    { id: 1, title: "Committee Meeting Reschedule", date: "2025-04-15", status: "Approved" },
    { id: 2, title: "End of Semester Exam Guidelines", date: "2025-04-10", status: "Pending" },
    { id: 3, title: "Faculty Budget Proposal", date: "2025-04-05", status: "Approved" },
  ];
  let systemUsers = [
    { email: "admin@aaua.edu.ng", name: "Dr. Adebayo", role: "Admin", dept: "Registry" },
    { email: "staff@aaua.edu.ng", name: "James Ogunleye", role: "Staff", dept: "Academic" },
    { email: "registrar@aaua.edu.ng", name: "Mrs. Fashina", role: "Registrar", dept: "Admin" },
  ];

  // Helper to render content based on active tab
  let activeTab = "statistics"; // default

  function renderActiveTab() {
    const container = document.getElementById('mainContent');
    if (!container) return;
    if (activeTab === "statistics") renderStatistics(container);
    else if (activeTab === "user-management") renderUserManagement(container);
    else if (activeTab === "create-memo") renderCreateMemo(container);
    else if (activeTab === "history") renderHistory(container);
    else if (activeTab === "profile") renderProfile(container);
  }

  function renderStatistics(container) {
    container.innerHTML = `
      <div class="section-title">📊 Institutional Analytics</div>
      <div class="stats-grid">
        <div class="stat-card"><h3>24</h3><p>Total Memos</p></div>
        <div class="stat-card"><h3>12</h3><p>Pending Approvals</p></div>
        <div class="stat-card"><h3>8</h3><p>Active Users</p></div>
        <div class="stat-card"><h3>5</h3><p>Departments</p></div>
      </div>
      <div style="margin-top: 32px; background:#f1f5f9; padding:18px; border-radius:24px;">
        <p style="font-weight:500;">📌 Recent Activity: 3 memos published this week · 87% response rate</p>
      </div>
    `;
  }

  function renderUserManagement(container) {
    let rows = systemUsers.map(u => `
      <tr>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td><span class="badge ${u.role === 'Admin' ? 'admin' : 'staff'}">${u.role}</span></td>
        <td>${u.dept}</td>
        <td><button class="logout-btn" style="padding:4px 12px;" disabled>🔒 Manage</button></td>
      </tr>
    `).join('');
    container.innerHTML = `
      <div class="section-title">👥 User Management</div>
      <div style="overflow-x:auto;">
        <table class="users-table">
          <thead><tr><th>Full Name</th><th>Email</th><th>Role</th><th>Department</th><th></th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="margin-top:24px;"><button class="primary-btn" id="inviteUserBtn">+ Invite New User</button></div>
    `;
    document.getElementById('inviteUserBtn')?.addEventListener('click', () => alert("Demo: Invite link sent to admin email."));
  }

  function renderCreateMemo(container) {
    container.innerHTML = `
      <div class="section-title">📝 Draft New Memorandum</div>
      <form id="newMemoForm" class="memo-form">
        <input type="text" id="memoTitle" placeholder="Memo Title (e.g., UPCOMING HOLIDAY)" required>
        <textarea id="memoContent" placeholder="Write the content of the memorandum..."></textarea>
        <select id="memoPriority">
          <option value="Urgent">Urgent</option>
          <option value="Normal">Normal</option>
          <option value="Confidential">Confidential</option>
        </select>
        <button type="submit" class="primary-btn">Publish Memorandum</button>
      </form>
      <div id="createMsg" style="margin-top:12px; font-size:13px;"></div>
    `;
    const form = document.getElementById('newMemoForm');
    form?.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('memoTitle').value;
      const content = document.getElementById('memoContent').value;
      if (!title) return;
      const newMemo = {
        id: Date.now(),
        title: title,
        date: new Date().toISOString().split('T')[0],
        status: "Pending",
        preview: content.substring(0, 60)
      };
      memoHistory.unshift(newMemo);
      document.getElementById('createMsg').innerHTML = '<span style="color:#10b981;">✓ Memo created successfully! View in History.</span>';
      setTimeout(() => document.getElementById('createMsg').innerHTML = '', 2500);
      form.reset();
    });
  }

  function renderHistory(container) {
    if (memoHistory.length === 0) {
      container.innerHTML = `<div class="section-title">📋 Memo History</div><div class="empty-state">No memos created yet. Use "Create" tab.</div>`;
      return;
    }
    let itemsHtml = memoHistory.map(m => `
      <div class="history-item">
        <div class="history-title">📄 ${m.title}</div>
        <div style="font-size:12px; margin-top:4px;">Status: <strong>${m.status}</strong> · ${m.date}</div>
        <div style="font-size:12px; color:#5a687c;">${m.preview || "Click to view full content"}</div>
      </div>
    `).join('');
    container.innerHTML = `<div class="section-title">📜 Memo History</div><div class="history-list">${itemsHtml}</div>`;
  }

  function renderProfile(container) {
    container.innerHTML = `
      <div class="section-title">👤 My Profile</div>
      <div class="profile-detail">
        <div class="profile-row"><div class="profile-label">Full Name</div><div class="profile-value">${currentUser.name}</div></div>
        <div class="profile-row"><div class="profile-label">Email Address</div><div class="profile-value">${currentUser.email}</div></div>
        <div class="profile-row"><div class="profile-label">Role</div><div class="profile-value">${currentUser.role}</div></div>
        <div class="profile-row"><div class="profile-label">Department</div><div class="profile-value">${currentUser.department || "Academic Affairs"}</div></div>
        <div class="profile-row"><div class="profile-label">Last Login</div><div class="profile-value">${new Date().toLocaleString()}</div></div>
      </div>
      <button id="editProfileBtn" class="primary-btn" style="background:#334155;">✏️ Edit profile (demo)</button>
    `;
    document.getElementById('editProfileBtn')?.addEventListener('click', () => alert("Profile editing simulation. Connect Firestore for persistence."));
  }

  // Bottom Nav activation
  function setActiveTab(tabId) {
    activeTab = tabId;
    document.querySelectorAll('.nav-item').forEach(item => {
      if (item.getAttribute('data-tab') === tabId) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    });
    renderActiveTab();
  }

  function attachNavEvents() {
    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        const tab = item.getAttribute('data-tab');
        if (tab) setActiveTab(tab);
      });
    });
  }

  // On load: set default tab & user info
  function loadDashboard() {
    // get stored email from localStorage (if coming from login)
    const storedEmail = localStorage.getItem('aaua_memo_email');
    if (storedEmail) {
      currentUser.email = storedEmail;
      currentUser.name = storedEmail.split('@')[0].replace('.', ' ').replace(/_/g, ' ');
      if (storedEmail.includes('admin')) currentUser.role = "Admin";
      else currentUser.role = "Staff";
    }
    document.getElementById('userEmailDisplay').innerText = currentUser.email;
    // default active tab = statistics (icon bigger and highlight)
    setActiveTab('statistics');
    attachNavEvents();
